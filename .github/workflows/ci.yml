name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Runtime guard tests
        run: pnpm run test:security

      - name: Prepare public vulnerability database
        run: node scripts/prepare-offline-audit.mjs

      - name: Offline dependency audit
        run: pnpm run deps:audit

      - name: TypeScript Build
        run: pnpm build

      - name: Run ESLint
        run: pnpm lint

      - name: Run Prettier Check
        run: pnpm format:check

  lua-lint:
    name: Luau Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Aftman
        uses: ok-nick/setup-aftman@e226f24209f47677da7b215bab44f6351a2c043b
        with:
          version: v0.3.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check StyLua formatting
        run: stylua --check .

      - name: Run Selene
        run: selene apps/game/include

  rojo-build:
    name: Rojo Build
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TypeScript
        run: pnpm build

      - name: Install Aftman tools
        uses: ok-nick/setup-aftman@e226f24209f47677da7b215bab44f6351a2c043b
        with:
          version: v0.3.0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rojo project
        run: rojo build apps/game/default.project.json --output game.rbxl

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: game-build
          path: game.rbxl
          retention-days: 7
