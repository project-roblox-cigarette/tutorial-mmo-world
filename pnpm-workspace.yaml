packages:
  - 'apps/*'
  - 'packages/*'

minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
ignoreScripts: true
overrides:
  'roblox-ts>chokidar': 6.0.0
  'undici@6': 6.29.1
  'undici-types@6': 6.29.1
  'semver@6': 7.8.5

# Refuse unsupported engines, including workspace packages.
engineStrict: true
